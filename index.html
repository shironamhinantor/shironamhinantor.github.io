cloudPush=async function(force){

  const o={...vault};delete o.sy;const n=await put2(r,JSON.stringify(o));await r.set({c:n,t,...pfFields(m)},{merge:true});
  for(let k=n;k<old;k++)await r.collection("c").doc(""+k).delete();
  vault.sy=t;await dbSet(vault);CS="ok";SYE="";LSY=Date.now()}

  const lf=(vault.files||[]).length,cf=(cv.files||[]).length;
  if(cf>lf||(cf===lf&&ct>=(vault.ts||0)))return pullFrom(r,m);
  return cloudPush(true)}
 const newer=ct>(vault.ts||0)?cv:vault,older=newer===cv?vault:cv,seen=new Set((newer.files||[]).map(s=>s.ct)),files2=[...(newer.files||[])];
 for(const s of older.files||[])if(!seen.has(s.ct)){files2.push(s);seen.add(s.ct)}
 const mg={...newer,files:files2};mg.sy=ct;mg.ts=Math.max(vault.ts||0,ct)+1;
 const k0=key,same=!!k0;vault=mg;await dbSet(mg);
 if(same){try{files=await openFiles(k0,mg.files);IT=mg.it?await open(k0,mg.it):[];QS=mg.qs?await open(k0,mg.qs):[];FM=mg.fm?await open(k0,mg.fm):[]}catch(_){key=null;files=[];IT=[];QS=[];FM=[]}if(!(editing||busy))render();if(key)setTimeout(bgThumbs,600)}

autoSync=async function(){

  if(!m.exists){if(vault)next=1;return}

let CR=null;
async function cropOpen(file){

 const w0=$("#cvw"),fw=Math.max(160,Math.min(w0.clientWidth-24,440,(w0.clientHeight-24)*1.2)),fh=Math.round(fw*5/6),cv=$("#cvc"),dp=Math.min(devicePixelRatio||1,2);
